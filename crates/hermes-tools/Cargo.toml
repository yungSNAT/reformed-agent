[package]
name = "hermes-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tool registry, toolsets, and tool implementations for Hermes Agent"

[dependencies]
hermes-core = { workspace = true }
hermes-config = { workspace = true }
hermes-intelligence = { workspace = true }
hermes-skills = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "multipart", "stream"] }
rusqlite = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
serde_yaml = { workspace = true }
url = { workspace = true }
rand = "0.10.1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
shlex = "1.3.0"

[dev-dependencies]
hermes-config = { workspace = true, features = ["test-helpers"] }
wiremock = "0.6"
