[package]
name = "hermes-desktop-gateway"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Preview backend that Hermes Desktop attaches to by URL and token to chat"
publish = false

[[bin]]
name = "hermes-desktop-gateway"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = { workspace = true }
clap = { workspace = true }
hermes-agent = { workspace = true }
hermes-app-runtime = { workspace = true }
hermes-config = { workspace = true }
hermes-core = { workspace = true }
hermes-provider-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = "2.6"
tokio = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
futures = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
tempfile = "3"
tokio-tungstenite = { workspace = true }
