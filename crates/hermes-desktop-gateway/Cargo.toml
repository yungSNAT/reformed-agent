[package]
name = "hermes-desktop-gateway"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Preview backend that Hermes Desktop attaches to by URL and token to chat"
publish = false

[[bin]]
name = "hermes-desktop-gateway"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
getrandom = "0.4"
hermes-agent = { workspace = true }
hermes-app-runtime = { workspace = true }
hermes-config = { workspace = true }
hermes-core = { workspace = true }
hermes-intelligence = { workspace = true }
hermes-provider-runtime = { workspace = true }
hermes-tools = { workspace = true }
percent-encoding = "2"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = "0.10"
subtle = "2.6"
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = "3"
