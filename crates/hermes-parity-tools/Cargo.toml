[package]
name = "hermes-parity-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Parity gates and report generators run by CI; not part of the hermes binary"
publish = false

[dependencies]
jiff = { workspace = true }
clap = { workspace = true }
fancy-regex = "0.11"
regex = { workspace = true }
hermes-py = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
syn = { version = "2", features = ["full"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
