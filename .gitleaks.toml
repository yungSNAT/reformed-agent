# Secret scanning, run by .github/workflows/secrets.yml on every pull request and push and
# weekly over the whole history, and by the release workflow over the tagged tree. betterleaks
# needs this file named outright (--config .gitleaks.toml).
#
# The default betterleaks rules cover credentials. The allowlists below were triaged from a
# scan of main's tree and history on 18 November 2026 by rule and file only: fixtures in the
# test suites, examples in the documentation and skill references, and code that detects or
# redacts credentials and so carries samples of them. Each code file is allowed only the rules
# it was found with, so any other kind of credential in it still fails. History findings in
# files that no longer exist are listed by fingerprint in .gitleaksignore.

title = "reformed-agent"

[extend]
useDefault = true

# betterleaks reports each credential below only beside its companion value: an AWS key ID
# within 5 lines of its secret key, say, or an Azure client secret near its tenant and client
# IDs. gitleaks reported each by itself. Clearing the components keeps that, so one committed
# alone still fails.
[[rules]]
id = "algolia-api-key"
components = []

[[rules]]
id = "artifactory-api-key"
components = []

[[rules]]
id = "artifactory-reference-token"
components = []

[[rules]]
id = "aws-access-token"
components = []

[[rules]]
id = "azure-ad-client-secret"
components = []

[[rules]]
id = "clickhouse-cloud-api-secret-key"
components = []

[[rules]]
id = "planetscale-api-token"
components = []

[[allowlists]]
description = "Fixtures in the test suites"
targetRules = ["generic-api-key", "generic-password", "generic-credential-uri", "gcp-application-default-credentials"]
paths = ['''^tests/''']

[[allowlists]]
description = "Examples in the documentation site"
targetRules = ["generic-password", "generic-credential-uri", "curl-auth-header", "discord-client-id", "mattermost-access-token"]
paths = ['''^website/docs/''']

[[allowlists]]
description = "Examples in skill instructions and references"
targetRules = ["generic-api-key", "generic-password", "generic-credential-uri"]
paths = ['''^(optional-)?skills/.+\.md$''']

[[allowlists]]
description = "Sample keys and passwords in code that parses, detects or redacts them, and in tests"
targetRules = ["generic-api-key"]
paths = [
  '''^crates/hermes-tools/src/credential_guard\.rs$''',
  '''^crates/hermes-tools/src/tools/browser\.rs$''',
  '''^optional-skills/productivity/telephony/scripts/telephony\.py$''',
  # The sample key from RFC 6455's opening handshake, in the vendored tungstenite.
  '''^third_party/rustsec-patches/tungstenite-0\.29\.0/src/handshake/server\.rs$''',
]

[[allowlists]]
description = "Sample passwords in code that parses or migrates them"
targetRules = ["generic-password"]
paths = [
  '''^crates/hermes-gateway/src/platforms/email\.rs$''',
  '''^optional-skills/migration/openclaw-migration/scripts/openclaw_to_hermes\.py$''',
  '''^plugins/dashboard_auth/basic/__init__\.py$''',
]

[[allowlists]]
description = "Sample credential URLs in the redaction and URL safety code"
targetRules = ["generic-credential-uri"]
paths = [
  '''^crates/hermes-intelligence/src/redact\.rs$''',
  '''^crates/hermes-tools/src/tools/url_safety\.rs$''',
]

[[allowlists]]
description = "A sample token in the redaction code"
# The generic rule matches the same sample once the token rule allows it.
targetRules = ["jwt", "generic-api-key"]
paths = ['''^crates/hermes-intelligence/src/redact\.rs$''']

[[allowlists]]
description = "A sample key in the credential guard"
targetRules = ["private-key"]
paths = ['''^crates/hermes-tools/src/credential_guard\.rs$''']

[[allowlists]]
description = "A sample bot token in the output filter"
targetRules = ["telegram-bot-api-token"]
paths = ['''^crates/hermes-tools/src/rtk_filter\.rs$''']

[[allowlists]]
description = "Sample application default credentials in the Vertex tests"
targetRules = ["gcp-application-default-credentials"]
paths = ['''^crates/hermes-agent/src/vertex/tests\.rs$''']
