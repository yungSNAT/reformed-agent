# Secret scanning, run by .github/workflows/secrets.yml on every pull request and push and
# weekly over the whole history, and by the release workflow over the tagged tree. betterleaks
# needs this file named outright (--config .gitleaks.toml).
#
# The default betterleaks rules cover credentials. The allowlists below were triaged from a
# scan of main's tree and history on 18 November 2026, by rule, file and line without reading
# the values: each flagged line either appears verbatim in upstream Hermes Agent's public
# history or lies in a test, comment, docstring or documentation example. Each file is allowed
# only the rules it was found with, so a new file, or another rule in a listed file, still
# fails. 3 of the files are found only in history: the Unsloth references at their earlier
# path, and an earlier version of tests/tools/test_terminal_tool.py. Other history findings,
# in files since removed or changed, are listed by fingerprint in .gitleaksignore.

title = "reformed-agent"

[extend]
useDefault = true

# betterleaks reports each credential below only beside its companion value: an AWS key ID
# within 5 lines of its secret key, say, or an Azure client secret near its tenant and client
# IDs. gitleaks reported each by itself. Clearing the components keeps that, so one committed
# alone still fails.
[[rules]]
id = "algolia-api-key"
components = []

[[rules]]
id = "artifactory-api-key"
components = []

[[rules]]
id = "artifactory-reference-token"
components = []

[[rules]]
id = "aws-access-token"
components = []

[[rules]]
id = "azure-ad-client-secret"
components = []

[[rules]]
id = "clickhouse-cloud-api-secret-key"
components = []

[[rules]]
id = "planetscale-api-token"
components = []

[[allowlists]]
description = "curl-auth-header in the files it was triaged in"
targetRules = ["curl-auth-header"]
paths = [
  '''^website/docs/user-guide/features/api-server\.md$''',
  '''^website/docs/user-guide/messaging/matrix\.md$''',
  '''^website/docs/user-guide/messaging/mattermost\.md$''',
  '''^website/docs/user-guide/messaging/open-webui\.md$''',
]

