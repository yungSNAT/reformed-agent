# SonarCloud automatic analysis scope. Each excluded path, what it holds, and why:
# third_party/: upstream crates vendored with this fork's RustSec patches (wired in through
#   [patch.crates-io] in Cargo.toml); the fork's patched lines there leave Sonar's scope too.
# plugins/: Hermes Python plugins inherited from Ultra, unchanged by this fork.
# tests/: upstream Hermes Python test suite, mirrored for parity mapping, with small edits by
#   this fork to 9 contract tests; this repository's CI does not run it.
# website/: the Docusaurus documentation site, with this fork's install and Windows page edits.
sonar.exclusions=third_party/**,plugins/**,tests/**,website/**
