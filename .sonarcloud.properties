# SonarCloud automatic analysis scope. Each excluded path, and why:
# third_party/: vendored upstream crates carrying RustSec patches; their fixes belong upstream.
# plugins/: upstream Hermes Python plugins mirrored as a parity reference.
# tests/: upstream Hermes Python test suite mirrored for parity mapping; this repository's CI does not run it.
# website/: the Docusaurus documentation site, not agent code.
sonar.exclusions=third_party/**,plugins/**,tests/**,website/**
