name: Parity Audit

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Pin the local and upstream audit revisions
        run: |
          local_sha=$(git rev-parse HEAD)
          test "$local_sha" = "$GITHUB_SHA"
          git remote add -t main upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream +refs/heads/main:refs/remotes/upstream/parity-audit
          upstream_sha=$(git rev-parse refs/remotes/upstream/parity-audit)
          git worktree add --detach ../hermes-agent "$upstream_sha"
          printf 'LOCAL_SHA=%s\nUPSTREAM_SHA=%s\n' "$local_sha" "$upstream_sha" >> "$GITHUB_ENV"
      # Upstream's live main moves daily, so this audit reports drift in the job
      # summary instead of failing on it; PR CI gates on the pinned revision
      # (scripts/run-repo-ci.sh). Errors and script crashes still fail the run.
      - name: Generate global parity artifacts
        run: |
          cargo run --locked -q -p hermes-parity-tools -- generate-parity-matrix --local-ref "$LOCAL_SHA" --upstream-branch parity-audit --no-fetch
          cargo run --locked -q -p hermes-parity-tools -- generate-workstream-status --upstream-ref "$UPSTREAM_SHA" --no-fetch
          cargo run --locked -q -p hermes-parity-tools -- generate-test-intent-mapping
          cargo run --locked -q -p hermes-parity-tools -- validate-intentional-divergence --upstream-ref "$UPSTREAM_SHA" --no-fetch --check --allow-warnings
          cargo run --locked -q -p hermes-parity-tools -- generate-adapter-matrix
          cargo run --locked -q -p hermes-parity-tools -- generate-shared-diff-backlog --local-ref "$LOCAL_SHA" --upstream-branch parity-audit --no-fetch
          cargo run --locked -q -p hermes-parity-tools -- generate-upstream-patch-queue --local-ref "$LOCAL_SHA" --upstream-branch parity-audit --no-fetch --max-commits 0
          # The coverage audit consumes the refreshed intent, matrix, divergence and queue reports.
          cargo run --locked -q -p hermes-parity-tools -- generate-test-coverage-audit
          cargo run --locked -q -p hermes-parity-tools -- generate-test-coverage-audit --check
          cargo run --locked -q -p hermes-parity-tools -- generate-global-parity-proof
          # Gate the proof's local metrics; the 4 upstream drift metrics are only reported.
          # The coverage ratio counts deferred and not-rechecked rows as uncovered, so it is
          # reported too; max_test_coverage_unaccounted_rows fails on any row in neither group
          # nor covered, and global_parity_governance ratchets both counts.
          jq -e '[.ci_gate.checks[] | select(.metric | IN("max_commits_behind", "max_upstream_patch_missing", "max_files_only_upstream", "max_queue_pending_commits", "min_test_coverage_tracked_behavior_ratio") | not) | select(.status == "fail" or .status == "missing")] == []' docs/parity/global-parity-proof.json > /dev/null
      - name: Generate public release readiness summary
        run: |
          python3 scripts/generate-release-readiness-summary.py --repo-root .
          cat .sync-reports/release-readiness-summary.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n[Upstream refresh plan](%s/%s/blob/%s/docs/upstream-sync.md#subsystem-refresh-for-v0232)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Report fork carry contracts
        shell: bash
        run: |
          cargo run --locked -q -p hermes-parity-tools -- check-fork-carry |
            tee -a "$GITHUB_STEP_SUMMARY" > .sync-reports/fork-carry-contracts.md
      - name: Upstream surface coverage report
        run: |
          report=.sync-reports/upstream-surface-coverage-gate.json
          test ! -e "$report"
          cargo run --locked -q -p hermes-parity-tools -- run-upstream-surface-coverage-gate --repo-root . --upstream-ref "$UPSTREAM_SHA" --local-ref "$LOCAL_SHA" --report-path "$report" || test "$?" -eq 1
          jq -er 'select(.summary.missing_total | type == "number") | "- Upstream surface files missing locally: `\(.summary.missing_total)` of `\(.summary.upstream_file_count)`"' "$report" >> "$GITHUB_STEP_SUMMARY"
      # The harness imports upstream's hermes_cli.commands, which needs upstream's
      # core dependencies. Upstream's uv.lock applies its dependency overrides,
      # which pip cannot, and the venv keeps them off the system Python.
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - name: Install upstream dependencies for the golden harness
        run: uv sync --frozen --no-dev --no-install-project --no-build --project ../hermes-agent
      - name: Golden parity harness
        run: |
          report=.sync-reports/golden-parity-harness.json
          test ! -e "$report"
          ../hermes-agent/.venv/bin/python scripts/run-golden-parity-harness.py \
            --repo-root . \
            --upstream-root ../hermes-agent \
            --report "$report" || test "$?" -eq 1
          jq -r '"- Upstream slash commands missing locally: `\(.missing_commands | length)` (baseline `\(.allow_missing_commands)`)"' "$report" >> "$GITHUB_STEP_SUMMARY"
          # Missing upstream commands are drift; the local TUI test and command contract checks still gate.
          jq -e '.missing_tui_tests == [] and .command_contract_failures == []' "$report" > /dev/null
      - name: Behavioral parity suite
        run: python3 scripts/run-behavioral-parity-suite.py --repo-root . --report .sync-reports/behavioral-parity.json
      - name: Bind report artifacts to the audit revisions
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$LOCAL_SHA"
          test "$(git rev-parse refs/remotes/upstream/parity-audit)" = "$UPSTREAM_SHA"
          test "$(git -C ../hermes-agent rev-parse HEAD)" = "$UPSTREAM_SHA"
          jq -se --arg local "$LOCAL_SHA" --arg upstream "$UPSTREAM_SHA" \
            'length == 2 and all(.[]; .refs.local_sha == $local and .refs.upstream_sha == $upstream)' \
            docs/parity/{parity-matrix,shared-diff-backlog}.json > /dev/null
          jq -e --arg upstream "$UPSTREAM_SHA" '.upstream_sha == $upstream' docs/parity/workstream-status.json > /dev/null
          jq -e --arg local "$LOCAL_SHA" '.refs.local_ref == $local and .refs.upstream_ref == "upstream/parity-audit"' \
            docs/parity/upstream-missing-queue.json > /dev/null
          jq -e --arg local "$LOCAL_SHA" --arg upstream "$UPSTREAM_SHA" \
            '.local_ref == $local and .upstream_ref == $upstream' \
            .sync-reports/upstream-surface-coverage-gate.json > /dev/null
          grep -Fxq "Fork carry contracts at $LOCAL_SHA" .sync-reports/fork-carry-contracts.md
          git diff --quiet "$LOCAL_SHA" -- docs/parity/sota-harness-matrix.{json,md}
          sha256sum \
            docs/parity/{parity-matrix,workstream-status,test-intent-mapping,test-coverage-audit,adapter-feature-matrix,shared-diff-backlog,global-parity-proof,upstream-missing-queue}.{json,md} \
            docs/parity/divergence-validation.json \
            .sync-reports/{release-readiness-summary.{json,md},upstream-surface-coverage-gate.json,golden-parity-harness.json,behavioral-parity.json,fork-carry-contracts.md} |
            jq -nR --arg local "$LOCAL_SHA" --arg upstream "$UPSTREAM_SHA" \
              '{version: 1, local_sha: $local, upstream_sha: $upstream,
                committed_reports: ["docs/parity/sota-harness-matrix.json", "docs/parity/sota-harness-matrix.md"],
                generated_reports: [inputs | capture("^(?<sha256>[0-9a-f]{64})  (?<path>.+)$")]}' \
              > .sync-reports/parity-audit-snapshot.json
          printf '\nAudit revisions: local %s, upstream %s.\n' "$LOCAL_SHA" "$UPSTREAM_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload parity artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-audit-artifacts
          include-hidden-files: true
          path: |
            docs/parity/parity-matrix.json
            docs/parity/parity-matrix.md
            docs/parity/workstream-status.json
            docs/parity/workstream-status.md
            docs/parity/test-intent-mapping.json
            docs/parity/test-intent-mapping.md
            docs/parity/test-coverage-audit.json
            docs/parity/test-coverage-audit.md
            docs/parity/sota-harness-matrix.json
            docs/parity/sota-harness-matrix.md
            docs/parity/adapter-feature-matrix.json
            docs/parity/adapter-feature-matrix.md
            docs/parity/divergence-validation.json
            docs/parity/shared-diff-backlog.json
            docs/parity/shared-diff-backlog.md
            docs/parity/global-parity-proof.json
            docs/parity/global-parity-proof.md
            docs/parity/upstream-missing-queue.md
            docs/parity/upstream-missing-queue.json
            .sync-reports/release-readiness-summary.json
            .sync-reports/release-readiness-summary.md
            .sync-reports/upstream-surface-coverage-gate.json
            .sync-reports/golden-parity-harness.json
            .sync-reports/behavioral-parity.json
            .sync-reports/parity-audit-snapshot.json
            .sync-reports/fork-carry-contracts.md
