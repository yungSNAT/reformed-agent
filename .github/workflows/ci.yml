name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The gates compare against the pinned upstream revision, so a result depends
      # on the change under test. The scheduled parity audit reports live drift.
      - name: Fetch upstream parity reference
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch --no-tags --depth=1 upstream \
            "+$(tr -d '[:space:]' < docs/parity/upstream-reference.txt):refs/remotes/upstream/parity-reference"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Generate parity governance artifacts
        run: |
          python3 scripts/generate-parity-matrix.py --local-ref HEAD --upstream-branch parity-reference --no-fetch
          python3 scripts/generate-workstream-status.py --upstream-ref upstream/parity-reference --no-fetch
          python3 scripts/generate-test-intent-mapping.py
          python3 scripts/validate-intentional-divergence.py --check --allow-warnings --upstream-ref upstream/parity-reference --no-fetch
          python3 scripts/generate-test-coverage-audit.py --check
          python3 scripts/generate-adapter-matrix.py
          python3 scripts/generate-shared-diff-backlog.py --local-ref HEAD --no-fetch --upstream-branch parity-reference
          python3 scripts/generate-upstream-patch-queue.py --local-ref HEAD --max-commits 0 --upstream-branch parity-reference --no-fetch
          python3 scripts/generate-global-parity-proof.py
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy Warning Gate
        run: bash scripts/clippy-warning-gate.sh --check
      - name: Rust module size policy
        run: cargo test -p hermes-source-parity-tests --test rust_module_size_policy -- --nocapture
      - name: Placeholder gate
        run: bash scripts/check-runtime-placeholders.sh
      - name: Tests
        run: cargo test --workspace
      - name: Parity fixture tests
        run: cargo test -p hermes-parity-tests
      - name: CLI command/action parity contract
        run: cargo test -p hermes-source-parity-tests --test cli_command_contract
      - name: Protocol differential parity contract
        run: cargo test -p hermes-protocol-parity-tests --test protocol_differential_contracts
      - name: Upstream slash-command parity gate
        run: python3 scripts/run-upstream-slash-parity-gate.py --upstream-ref upstream/parity-reference
      - name: Upstream surface coverage gate
        run: python3 scripts/run-upstream-surface-coverage-gate.py --repo-root . --upstream-ref upstream/parity-reference --local-ref HEAD
      - name: Global parity governance contract
        run: cargo test -p hermes-source-parity-tests --test global_parity_governance
      - name: Upstream webhook sync script lint
        run: |
          python3 -m py_compile scripts/upstream_webhook_sync.py
          python3 -m py_compile scripts/publish_automation_summary.py
          python3 -m py_compile scripts/run-golden-parity-harness.py
          python3 -m py_compile scripts/run-upstream-slash-parity-gate.py
          python3 -m py_compile scripts/run-upstream-surface-coverage-gate.py
          python3 -m py_compile scripts/generate-shared-diff-backlog.py
          python3 -m py_compile scripts/generate-test-coverage-audit.py
          python3 -m py_compile scripts/generate-release-readiness-summary.py
          python3 -m py_compile scripts/release_secret_scan.py

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Cross build hermes
        run: cross build --release --target ${{ matrix.target }} -p hermes-cli

  macos-build:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add x86_64-apple-darwin
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build hermes
        run: cargo build --locked --release --target ${{ matrix.target }} -p hermes-cli
