name: Secrets history

# The whole history, weekly and on demand, with main's own .gitleaks.toml.
# Separate from secrets.yml, and its job named differently, so that a manual
# run cannot record a passing 'secrets' check without that workflow's gate.
on:
  workflow_dispatch:
  schedule:
    - cron: "29 5 * * 2"

permissions:
  contents: read

concurrency:
  group: secrets-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secrets-history:
    name: secrets-history
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install betterleaks
        env:
          # The release .gitleaks.toml was tested with, and the SHA-256 that
          # release's checksums.txt gives for its Linux x64 archive.
          BETTERLEAKS_VERSION: 1.10.1
          BETTERLEAKS_SHA256: c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP:?}/$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/$archive"
          echo "${BETTERLEAKS_SHA256}  ${RUNNER_TEMP}/$archive" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/betterleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/betterleaks" betterleaks
          echo "$RUNNER_TEMP/betterleaks" >> "$GITHUB_PATH"

      - name: Betterleaks over the whole history
        # Findings are listed by rule, file, line and commit only, as in
        # secrets.yml: --verbose would print each flagged line whole.
        run: |
          report="${RUNNER_TEMP:?}/betterleaks-history.json"
          status=0
          betterleaks git . --config .gitleaks.toml --redact --no-banner \
            --report-format json --report-path "$report" || status=$?
          if [ -s "$report" ]; then
            jq -r '.[] | "\(.RuleID) \(.File):\(.StartLine) \(.Commit)"' "$report"
          fi
          exit "$status"
