name: Secrets

# Pull requests and pushes to main only. The weekly and manual full-history
# scan is secrets-history.yml, whose job has another name: run here, a manual
# run would skip the gate below and still record a passing 'secrets' check.
on:
  pull_request:
    # edited: a pull request moved to another base is scanned against it.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Keyed on the commit for a push: every pushed revision gets its own scan.
  # Keying on the ref would let a rapid second push cancel an earlier scan,
  # and those commits would then go unscanned.
  group: secrets-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # betterleaks scans commits, so a shallow checkout would leave every
          # earlier commit unscanned.
          fetch-depth: 0
          persist-credentials: false

      - name: Install betterleaks
        env:
          # The release .gitleaks.toml was tested with, and the SHA-256 that
          # release's checksums.txt gives for its Linux x64 archive.
          BETTERLEAKS_VERSION: 1.10.1
          BETTERLEAKS_SHA256: c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP:?}/$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/$archive"
          echo "${BETTERLEAKS_SHA256}  ${RUNNER_TEMP}/$archive" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/betterleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/betterleaks" betterleaks
          echo "$RUNNER_TEMP/betterleaks" >> "$GITHUB_PATH"

      - name: Betterleaks
        # A push scans the commits it adds, a pull request the commits between
        # its base and its head, with this revision's own .gitleaks.toml, named
        # outright because betterleaks does not load a repository's config by
        # itself. On a pull request this is what proves a changed .gitleaks.toml
        # still loads: the gate below reads the base's copy, so a broken one
        # that reached main would fail every later pull request, its own fix
        # included. Git shows nothing for a merge of three or more parents, so
        # a push or pull request holding one fails.
        #
        # Findings are listed by rule, file, line and commit only. --verbose
        # would print each flagged line whole, and --redact hides only the
        # finding's own value, so another credential on that line would show.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          range="${BASE_SHA:?}..${HEAD_SHA:?}"
          octopus="$(git rev-list --min-parents=3 "$range")"
          if [ -n "$octopus" ]; then
            echo "::error::A merge of three or more parents cannot be scanned for what it adds: ${octopus//$'\n'/ }"
            exit 1
          fi
          report="${RUNNER_TEMP:?}/betterleaks-own.json"
          status=0
          betterleaks git . --config .gitleaks.toml --redact --no-banner \
            --log-opts="--diff-merges=remerge $range" \
            --report-format json --report-path "$report" || status=$?
          if [ -s "$report" ]; then
            jq -r '.[] | "\(.RuleID) \(.File):\(.StartLine) \(.Commit)"' "$report"
          fi
          exit "$status"

      - name: Betterleaks over every pull request or pushed commit
        # The step above reads the revision's own files, so this step is the
        # gate: it uses the base's .gitleaks.toml and .gitleaksignore (for a
        # push, the commit main moved from), never the new revision's, and
        # ignores gitleaks:allow and betterleaks:allow comments, so a change
        # cannot pass this check by allowlisting what it adds in .gitleaks.toml,
        # .gitleaksignore or a comment. Nor can it hide a change behind
        # .gitattributes: betterleaks runs git in an empty work tree of its
        # own, where none is read. A new allowlist entry or fingerprint must
        # reach main first, on its own. --diff-merges=remerge shows what a
        # two-parent merge adds beyond its parents. Git shows nothing for a
        # merge of three or more parents, so one of those fails the check, as
        # does a range that holds no commit. Findings are listed as above.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          range="${BASE_SHA:?}..${HEAD_SHA:?}"
          # betterleaks reads the .gitleaksignore and .betterleaksignore in its
          # source folder and in --gitleaks-ignore-path, so it runs in a folder
          # holding only the base's copies, with GIT_DIR pointing it at this
          # checkout's history.
          git_dir="$(git rev-parse --absolute-git-dir)"
          base_config="${RUNNER_TEMP:?}/betterleaks-base"
          mkdir "$base_config"
          if [ -z "$(git rev-list -n 1 "$range")" ]; then
            echo "::error::No commit lies between the base and the head, so nothing would be scanned."
            exit 1
          fi
          octopus="$(git rev-list --min-parents=3 "$range")"
          if [ -n "$octopus" ]; then
            echo "::error::A merge of three or more parents cannot be scanned for what it adds: ${octopus//$'\n'/ }"
            exit 1
          fi
          if ! git show "$BASE_SHA:.gitleaks.toml" > "$base_config/.gitleaks.toml"; then
            echo "::error::The base has no .gitleaks.toml, so there is no reviewed configuration to scan with."
            exit 1
          fi
          # A base without .gitleaksignore leaves every finding in force.
          if git cat-file -e "$BASE_SHA:.gitleaksignore" 2> /dev/null; then
            git show "$BASE_SHA:.gitleaksignore" > "$base_config/.gitleaksignore"
          fi
          report="${RUNNER_TEMP:?}/betterleaks-base.json"
          status=0
          # && because -e does not apply on the left of ||.
          (cd "$base_config" && GIT_DIR="$git_dir" betterleaks git . \
            --config .gitleaks.toml --gitleaks-ignore-path . \
            --ignore-gitleaks-allow --redact --no-banner \
            --log-opts="--diff-merges=remerge $range" \
            --report-format json --report-path "$report") || status=$?
          if [ -s "$report" ]; then
            jq -r '.[] | "\(.RuleID) \(.File):\(.StartLine) \(.Commit)"' "$report"
          fi
          if [ "$status" -ne 0 ]; then
            # Only names the files; their changes still cannot pass the scan.
            changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- .gitleaks.toml .gitleaksignore || true)"
            if [ -n "$changed" ]; then
              echo "::error::This change edits ${changed//$'\n'/ and }, which may be why the scan failed: it uses the base's copy, so land that edit on main on its own first."
            fi
            exit "$status"
          fi
