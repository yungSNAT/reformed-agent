[package]
name = "hermes-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
hermes-gateway = { path = "../crates/hermes-gateway", features = ["fuzzing"] }
libfuzzer-sys = "0.4.12"

# Keep the fuzz crate out of the parent workspace.
[workspace]

[[bin]]
name = "webhook_request"
path = "fuzz_targets/webhook_request.rs"
test = false
doc = false
bench = false
